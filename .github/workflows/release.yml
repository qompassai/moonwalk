# Release publication is intentionally separate from build.yml: the build
# workflow tests every push/PR to main, while this workflow only runs on
# version tags and requires the build workflow to be green first.
# Publication failures must be loud -- never use continue-on-error here.
name: release
on:
  push:
    tags:
    - 'v*'
jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-latest
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules : recursive
    - uses: actboy168/setup-luamake@master
    - if: matrix.platform == 'linux-x64' || matrix.platform == 'linux-arm64'
      run: |
        sudo apt-get update && sudo apt-get install -y libiberty-dev
    - run: luamake lua compile/download_deps.lua
    - run: luamake -mode release -platform ${{ matrix.platform }}
    # Gate the release on the same suites the build workflow runs.
    - name: build native tests
      run: luamake -test -mode release -platform ${{ matrix.platform }}
    - name: run native tests (fail-closed discovery)
      run: luamake test
    - name: run Lua unit tests
      run: luamake lua test/unit/run_unit.lua
    - name: run P0 DAP conformance tests
      run: python3 test/dap/run.py --suite p0
    - run: npm install -g @vscode/vsce ovsx
    # The build generates extension/package.json from
    # compile/common/package_json.lua; publish from there, not from the
    # nonexistent `publish/` directory the old workflow used.
    - run: npx vsce publish --target ${{ matrix.platform }} -p ${{ secrets.VSCE_KEY }}
      working-directory: extension
    - run: npx ovsx publish --target ${{ matrix.platform }} -p ${{ secrets.OVSX_KEY }}
      working-directory: extension
